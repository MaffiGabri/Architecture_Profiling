name: Android Native App CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Android Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python for APK validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify Shared Assets Exist Before Build
        run: |
          test -f shared/data/styles.json || { echo "shared/data/styles.json missing"; exit 1; }
          test $(ls shared/images/*.png | wc -l) -ge 10 || { echo "Mock images missing"; exit 1; }
          echo "[OK] Shared assets verified in repository."

      - name: Run Android JVM Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK Structure & Asset Decoding
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi
          python scripts/verify_apk.py "$APK_PATH"

      - name: Run Cross-Platform Determinism Oracle
        run: |
          python scripts/verify_cross_platform_determinism.py

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: architecture-profiling-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
